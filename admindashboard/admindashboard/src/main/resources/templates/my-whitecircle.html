<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My WhiteCircle - Quick Actions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
		:root {
		    --bs-primary: #0066ff; 
		    --bg-color: #dcdcdc;  
		    --card-bg: #bcbcbc;   
		    --card-border: #666666;
		}

		body {
		    font-family: 'Inter', sans-serif;
		    background-color: var(--bg-color);
		    color: #000000;
		    overflow-x: hidden;
		    margin: 0;
		    padding: 0;
		}

		/* --- MOCKUP HEADER BAR --- */
		/* --- SINGLE CARD HEADER NAVIGATION FIX --- */
		.top-header {
		    background: white;
		    padding: 15px 40px;
		    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
		    display: flex; justify-content: flex-start; align-items: center;
		    height: 90px;
		}

		.btn-circular-back-hub {
		    width: 44px;
		    height: 44px;
		    background-color: #0066ff;
		    color: #ffffff !important;
		    border-radius: 50%;
		    display: flex;
		    align-items: center;
		    justify-content: center;
		    font-size: 1.2rem;
		    text-decoration: none;
		    border: none;
		    margin-right: 25px; 
		    flex-shrink: 0;
		}

		/* Sizing wrapper for the single card and divider line */
		.mockup-badge-container {
		    display: flex;
		    align-items: center;
		    justify-content: center;
		    padding-right: 25px; /* Creates clean spacing before the vertical line */
		    /* This creates the crisp vertical divider line from your mockup */
		    border-right: 2px solid #000000; 
		    height: 42px; 
		    flex-shrink: 0;
		}

		/* Bold layout for the single card icon */
		.mockup-icon-card-only {
		    font-size: 2.3rem !important; /* Made larger and bolder to fill out the workspace layout */
		    color: #000000 !important;
		    display: inline-block;
		    line-height: 1;
		}

		.header-title-text {
		    font-size: 2.4rem;
		    font-weight: 700;
		    color: #000000;
		    letter-spacing: -0.5px;
		    padding-left: 25px; /* Equal spacing after the vertical line */
		    line-height: 1;
		}
		/* --- CONTENT MAIN WRAPPER CANVAS --- */
		.main-content-canvas {
		    margin-top: 150px;
		    max-width: 1200px;
		    margin-left: auto;
		    margin-right: auto;
		    padding: 0 25px 60px 25px;
		}

		.section-headline-title {
		    font-size: 1.6rem;
		    font-weight: 700;
		    color: #000000;
		    margin-bottom: 35px;
		    position: relative;
		    display: inline-block;
		}
		.section-headline-title::after {
		    content: '';
		    position: absolute;
		    left: 0;
		    bottom: -6px;
		    width: 75px; 
		    height: 3px;
		    background-color: #0066ff;
		}

		/* --- ENHANCED GRID ITEM ROW GAP --- */
		
		.custom-grid-row {
		    row-gap: 55px !important; /* Adjust this number higher or lower to get your perfect spacing */
		}
		

		/* --- ACTION BOX MATRIX CARDS --- */
		.action-box {
		    background: var(--card-bg); 
		    border: 1px solid var(--card-border);
		    border-radius: 16px; 
		    padding: 20px 10px;
		    text-align: center;
		    height: 140px; 
		    display: flex;
		    flex-direction: column;
		    align-items: center;
		    justify-content: center;
		    gap: 12px;
		    cursor: pointer;
		    transition: background-color 0.15s, transform 0.1s;
		}
		.action-box:hover {
		    background-color: #b0b0b0;
		    transform: scale(1.02);
		}

		.icon-wrapper-flat {
		    color: #000000;
		    font-size: 2.2rem;
		    display: flex;
		    align-items: center;
		    justify-content: center;
		}

		.box-title {
		    font-weight: 600;
		    color: #000000;
		    font-size: 0.85rem;
		    line-height: 1.2;
		}
    </style>

    <style>
        @media (max-width: 991px) {
            .top-header { padding: 10px 20px !important; height: 75px !important; }
            .btn-circular-back-hub { width: 36px !important; height: 36px !important; font-size: 1rem !important; margin-right: 12px !important; }
            .mockup-badge-container { width: 38px !important; height: 30px !important; margin-right: 10px !important; }
            .mockup-icon-user { font-size: 1.5rem !important; }
            .mockup-icon-card { font-size: 1.2rem !important; }
            .header-separator { margin-right: 15px !important; height: 25px !important; }
            .header-title-text { font-size: 1.4rem !important; }
            .main-content-canvas { margin-top: 110px !important; padding: 0 15px !important; }
            .section-headline-title { font-size: 1.3rem !important; margin-bottom: 25px !important; }
            .action-box { height: 120px !important; border-radius: 12px !important; }
            .icon-wrapper-flat { font-size: 1.8rem !important; }
            .box-title { font-size: 0.75rem !important; }
        }
    </style>
</head>
<body>

<header class="top-header">
    <a href="/employee/dashboard" class="btn-circular-back-hub" title="Back to Dashboard">
        <i class="fa-solid fa-arrow-left"></i>
    </a>
    
    <div class="mockup-badge-container">
        <i class="fa-solid fa-address-card mockup-icon-card-only"></i>
    </div>
    
    <div class="header-title-text">My WhiteCircle</div>
</header>
<main class="main-content-canvas">
    <h5 class="section-headline-title">Quick Actions</h5>

    <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 gx-4 custom-grid-row">
        <div class="col">
            <div class="action-box" onclick="window.location.href='/my-timeoff'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-calendar-check"></i></div>
                <div class="box-title">Leave Request</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/employee/full-profile'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-user-gear"></i></div>
                <div class="box-title">View Profile</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/coming-soon'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-sitemap"></i></div>
                <div class="box-title">Org. Chart</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/employee/timesheet-report'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-clock-rotate-left"></i></div>
                <div class="box-title">TimeSheet</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/coming-soon'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-bullseye"></i></div>
                <div class="box-title">Manage Goal</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/coming-soon'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-graduation-cap"></i></div>
                <div class="box-title">View Learning</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/coming-soon'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-mobile-screen-button"></i></div>
                <div class="box-title">Activate Mobile</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/coming-soon'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-list-check"></i></div>
                <div class="box-title">Pending Workflows</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/coming-soon'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-bell"></i></div>
                <div class="box-title">View Reminder</div>
            </div>
        </div>

        <div class="col">
            <div class="action-box" onclick="window.location.href='/coming-soon'">
                <div class="icon-wrapper-flat"><i class="fa-solid fa-star"></i></div>
                <div class="box-title">View Favourite</div>
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
