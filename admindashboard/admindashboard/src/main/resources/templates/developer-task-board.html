<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Task Board | WhiteCircle</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bs-primary: #1e3a8a;
            --bs-accent: #2563eb;
            --bg-color: #f4f7fb;
            --text-dark: #0f172a;
            --border-light: #e2e8f0;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: var(--text-dark); padding-bottom: 50px; }

        /* --- HEADER --- */
        .dev-nav { background-color: #0f172a; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; color: white; position: sticky; top: 0; z-index: 1000; }

        /* --- TASK CARDS --- */
        .task-card { background: white; border: 1px solid var(--border-light); border-left: 4px solid var(--bs-accent); border-radius: 10px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); transition: transform 0.2s; }
        .task-card:hover { transform: translateX(5px); border-color: #cbd5e1; }

        .progress-bar-custom { background-color: var(--border-light); height: 8px; border-radius: 10px; width: 100%; overflow: hidden; margin-top: 10px; }
        .progress-fill { background: linear-gradient(90deg, var(--bs-primary), var(--bs-accent)); height: 100%; border-radius: 10px; }

        .btn-work { background: #f8fafc; border: 1px solid #cbd5e1; color: var(--text-dark); font-weight: 700; font-size: 0.8rem; padding: 8px 15px; border-radius: 6px; text-decoration: none; display: inline-block; transition: all 0.2s; }
        .btn-work:hover { background: var(--bs-primary); color: white; border-color: var(--bs-primary); }
    </style>
</head>
<body>

<nav class="dev-nav">
    <div class="d-flex align-items-center gap-3">
        <i class="fas fa-terminal fs-5 text-success"></i>
        <h5 class="fw-bold m-0 text-white">Execution Board</h5>
    </div>
    <div class="fw-bold" style="font-size: 0.9rem;">
        <i class="fas fa-user-astronaut me-1 text-info"></i> <span th:text="${developerName}">Developer</span>
    </div>
</nav>

<div class="container-fluid" style="max-width: 1000px; margin-top: 30px;">

    <div class="mb-4 d-flex justify-content-between align-items-end">
        <div>
            <h4 class="fw-bold text-dark m-0">My Assigned Tasks</h4>
            <p class="text-muted mt-1 mb-0" style="font-size: 0.9rem;">Manage your active subtasks and update execution progress.</p>
        </div>
        <div class="badge bg-primary text-white p-2 px-3 rounded-pill" th:text="${#lists.size(myTasks)} + ' Active Tasks'">0 Active Tasks</div>
    </div>

    <div th:each="task : ${myTasks}" class="task-card">
        <div class="row align-items-center">

            <div class="col-md-5">
                <div class="small fw-bold text-muted text-uppercase mb-1" th:text="${task.project != null ? task.project.projectName : 'Unassigned'}">Project Name</div>
                <h5 class="fw-bold m-0 text-primary" th:text="${task.title}">Task Title</h5>
                <p class="text-muted small mt-1 mb-0" th:text="${task.description}">Description...</p>
            </div>

            <div class="col-md-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="small fw-bold text-dark">Overall Progress</span>
                    <span class="badge bg-success bg-opacity-10 text-success border border-success" th:text="${task.progressPercentage} + '%'">0%</span>
                </div>
                <div class="progress-bar-custom">
                    <div class="progress-fill" th:style="'width: ' + ${task.progressPercentage} + '%'"></div>
                </div>
            </div>

            <div class="col-md-3 text-end">
                <a href="#" class="btn-work"><i class="fas fa-code-branch me-1"></i> Open Workspace</a>
            </div>

        </div>
    </div>

    <div th:if="${#lists.isEmpty(myTasks)}" class="text-center py-5 bg-white border rounded-3 mt-3">
        <i class="fas fa-mug-hot fs-1 text-muted mb-3 opacity-50"></i>
        <h5 class="fw-bold text-dark">You're all caught up!</h5>
        <p class="text-muted">No pending tasks have been assigned to you yet.</p>
    </div>

</div>

</body>
</html>
