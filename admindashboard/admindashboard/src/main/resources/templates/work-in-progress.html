<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - WhiteCircle</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bs-primary: #1e3a8a; /* WhiteCircle Navy */
            --bg-color: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #334155;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            overflow-x: hidden;
        }

        /* HEADER */
        .top-header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
        }

        .brand-section {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--bs-primary);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* MAIN CONTENT CENTERING */
        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 20px 40px; /* Accounts for fixed header */
        }

        /* CARD STYLING */
        .wip-card {
            background: white;
            border-radius: 24px;
            padding: 60px 40px;
            text-align: center;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(30, 58, 138, 0.08);
            border: 1px solid #e2e8f0;
            transition: transform 0.3s ease;
        }

        .wip-card:hover {
            transform: translateY(-5px);
        }

        /* ANIMATED ICON SECTION */
        .icon-container {
            width: 120px;
            height: 120px;
            background: #eff6ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 35px;
            position: relative;
        }

        .icon-container i {
            font-size: 3.5rem;
            color: var(--bs-primary);
            z-index: 2;
        }

        /* Floating effect for the hard hat/tools */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .floating-icon {
            animation: float 3s ease-in-out infinite;
        }

        /* Pulsing background circles */
        .icon-container::before, .icon-container::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: #dbeafe;
            z-index: 1;
            animation: pulse 2.5s infinite ease-in-out;
        }
        .icon-container::before { width: 100%; height: 100%; animation-delay: 0s; }
        .icon-container::after { width: 130%; height: 130%; background: #eff6ff; opacity: 0.6; animation-delay: -1.25s; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        /* TYPOGRAPHY */
        .wip-title {
            font-weight: 800;
            font-size: 2.2rem;
            color: #0f172a;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .wip-text {
            color: #64748b;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 40px;
            padding: 0 15px;
        }

        /* BUTTON STYLING */
        .btn-navy {
            background-color: var(--bs-primary);
            color: white;
            padding: 14px 35px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            border: none;
            box-shadow: 0 4px 10px rgba(30, 58, 138, 0.2);
        }

        .btn-navy:hover {
            background-color: #172554;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 58, 138, 0.3);
        }

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 768px) {
            .wip-card { padding: 40px 25px; }
            .wip-title { font-size: 1.8rem; }
            .icon-container { width: 100px; height: 100px; }
            .icon-container i { font-size: 2.8rem; }
            .top-header { padding: 15px 20px; }
        }
    </style>
</head>
<body>

<header class="top-header">
    <div class="col-md-4 ps-4 d-flex align-items-center">
        <img src="/images/wcg-logo.jpg"
             alt="Logo"
             style="height: 60px; width: auto; border-radius: 8px;">
        <span class="ms-3 fw-bold text-dark"
              style="font-size: 1.6rem; letter-spacing: 1px; text-transform: uppercase;">
                White Circle
            </span>
    </div>
</header>

<main class="main-content">
    <div class="wip-card">
        <div class="icon-container floating-icon">
            <i class="fas fa-hard-hat"></i>
        </div>

        <h1 class="wip-title">Work in Progress</h1>
        <p class="wip-text">
            We are actively building and fine-tuning this module to enhance your employee experience. Please check back soon to explore this features!
        </p>

        <a href="/employee/dashboard" class="btn-navy">
            <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
        </a>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
