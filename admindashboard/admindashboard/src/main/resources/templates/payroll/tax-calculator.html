<!DOCTYPE html>
<html lang="en"
xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Tax Calculator</title>

    <!-- Base -->

    <link rel="stylesheet"
    th:href="@{/css/base/reset.css}">

    <link rel="stylesheet"
    th:href="@{/css/base/variables.css}">

    <link rel="stylesheet"
    th:href="@{/css/base/typography.css}">

    <!-- Layout -->

    <link rel="stylesheet"
    th:href="@{/css/layout/dashboard-layout.css}">

    <link rel="stylesheet"
    th:href="@{/css/layout/sidebar.css}">

    <!-- Components -->

    <link rel="stylesheet"
    th:href="@{/css/components/buttons.css}">

    <link rel="stylesheet"
    th:href="@{/css/components/forms.css}">

    <link rel="stylesheet"
    th:href="@{/css/components/cards.css}">

    <link rel="stylesheet"
    th:href="@{/css/components/tables.css}">

    <!-- Page -->

    <link rel="stylesheet"
    th:href="@{/css/pages/tax-calculator.css}">

    <!-- Icons -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="dashboard-container">

    <!-- Sidebar -->

    <aside th:replace="fragments/sidebar :: sidebar"></aside>

    <!-- Main Content -->

    <main class="main-content">

        <h1 class="page-title">
            Income Tax Calculator
        </h1>

        <section class="tax-layout">

            <!-- LEFT SECTION -->

            <div class="tax-form-section">

                <div class="tax-section-header">

                    <i class="fa-regular fa-file-lines"></i>

                    <h2>
                        Simulate Your Tax
                    </h2>

                </div>

                <!-- Top Grid -->

                <div class="tax-top-grid">

                    <div class="form-group">

                        <label>Tax Year</label>

                        <select class="payroll-select">

                            <option>2026</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Age Group</label>

                        <select class="payroll-select">

                            <option>Below 60</option>

                        </select>

                    </div>

                </div>

                <!-- Salary -->

                <div class="form-group full-width">

                    <label>
                        Gross Annual Salary
                    </label>

                    <input
                    type="text"
                    class="tax-input"
                    placeholder="Enter Gross Salary">

                </div>

                <!-- Tax Fields -->

                <div class="tax-field-list">

                    <div class="tax-row">

                        <span>Exemptions</span>

                        <input
                        type="text"
                        class="tax-small-input">

                    </div>

                    <div class="tax-row">

                        <span>Professional Tax</span>

                        <input
                        type="text"
                        class="tax-small-input">

                    </div>

                    <div class="tax-row">

                        <span>Income From Other Sources</span>

                        <input
                        type="text"
                        class="tax-small-input">

                    </div>

                </div>

                <button class="primary-btn">

                    Calculate Result

                </button>

            </div>

            <!-- RIGHT SECTION -->

            <div class="tax-table-section">

                <div class="tax-section-header">

                    <i class="fa-solid fa-scale-balanced"></i>

                    <h2>
                        Tax Comparison
                    </h2>

                </div>

                <table class="tax-table">

                    <thead>

                        <tr>

                            <th>Metrics</th>

                            <th>Old Regime</th>

                            <th>New Regime</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr>

                            <td>Gross Salary</td>

                            <td>₹ 1,40,000</td>

                            <td>₹ 1,85,000</td>

                        </tr>

                        <tr>

                            <td>Taxable Income</td>

                            <td>₹ 1,10,000</td>

                            <td>₹ 1,24,000</td>

                        </tr>

                        <tr>

                            <td>Total Tax</td>

                            <td>₹ 10,00,000</td>

                            <td>₹ 10,00,000</td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

</body>

</html>
