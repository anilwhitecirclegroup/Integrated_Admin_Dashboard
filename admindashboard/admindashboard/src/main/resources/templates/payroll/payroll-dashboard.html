<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Payroll Dashboard</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/base/reset.css}">
    <link rel="stylesheet" th:href="@{/css/base/variables.css}">
    <link rel="stylesheet" th:href="@{/css/base/typography.css}">
    <link rel="stylesheet" th:href="@{/css/layouts/dashboard-layout.css}">
    <link rel="stylesheet" th:href="@{/css/layouts/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/forms.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <link rel="stylesheet" th:href="@{/css/pages/payroll-dashboard.css}">

</head>

<body>

<div class="app-layout">

    <div th:replace="fragments/sidebar :: sidebar"></div>

    <main class="main-content">

        <h1 class="page-title">
            Payroll & Tax
        </h1>

        <section class="payroll-grid">

            <!-- Payslip -->

            <div class="payroll-card">

                <div class="payroll-card-header">
                    <i class="fa-regular fa-file-lines"></i>
                    <h3 class="payroll-card-title">Payslip</h3>
                </div>

                <div class="payroll-select-group">

                    <select class="payroll-select">
                        <option>Year</option>
                    </select>

                    <select class="payroll-select">
                        <option>Month</option>
                    </select>

                </div>

                <div class="payroll-action">

                    <button class="primary-btn">
                        Download Slip
                    </button>

                    <button class="icon-btn">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

            </div>

            <!-- Tax Computation -->

            <div class="payroll-card">

                <div class="payroll-card-header">
                    <i class="fa-solid fa-calculator"></i>
                    <h3 class="payroll-card-title">
                        Tax Computation
                    </h3>
                </div>

                <div class="payroll-select-group">

                    <select class="payroll-select">
                        <option>Year</option>
                    </select>

                    <select class="payroll-select">
                        <option>Month</option>
                    </select>

                </div>

                <div class="payroll-action">

                    <button class="primary-btn">
                        Download Report
                    </button>

                    <button class="icon-btn">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

            </div>

            <!-- PF Contribution -->

            <div class="payroll-card">

                <div class="payroll-card-header">
                    <i class="fa-solid fa-shield"></i>

                    <h3 class="payroll-card-title">
                        PF Contribution
                    </h3>

                </div>

                <div class="payroll-select-group">

                    <select class="payroll-select" style="width:100%;">
                        <option>Select Year</option>
                    </select>

                </div>

                <div class="payroll-action">

                    <button class="primary-btn">
                        Transaction History
                    </button>

                    <button class="icon-btn">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

            </div>

        </section>

        <section class="payroll-grid-bottom">

            <!-- Compensation -->

            <div class="payroll-card">

                <div class="payroll-card-header">

                    <i class="fa-solid fa-briefcase"></i>

                    <h3 class="payroll-card-title">
                        Compensation
                    </h3>

                </div>

                <div class="payroll-select-group">

                    <select class="payroll-select" style="width:100%;">
                        <option>Current</option>
                    </select>

                </div>

                <div class="payroll-action">

                    <button class="primary-btn">
                        View Details
                    </button>

                    <button class="icon-btn">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

            </div>

            <!-- Form 16 -->

            <div class="payroll-card">

                <div class="payroll-card-header">

                    <i class="fa-regular fa-file-lines"></i>

                    <h3 class="payroll-card-title">
                        Form 16
                    </h3>

                </div>

                <div class="payroll-action">

                    <button class="primary-btn small-btn">
                        Download Form 16
                    </button>

                    <button class="icon-btn">
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

            </div>

        </section>

            </main>

        </div>

</body>
</html>
