<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management Board | WhiteCircle</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #1e3a8a;
            --navy-hover: #172a6b;
            --bg-color: #f8fafc;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: #0f172a;
            padding-top: 100px;
        }

        .master-nav {
            position: fixed; top: 0; left: 0; right: 0; height: 80px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 45px; z-index: 1000; border-bottom: 2px solid var(--navy);
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }

        .btn-back {
            background: #1e3a8a; color: white; padding: 10px 24px; border-radius: 10px;
            font-size: 0.95rem; text-decoration: none; border: none; transition: all 0.2s;
        }
        .btn-back:hover { background: #172554; color: white; transform: translateY(-1px); }

        .main-container { max-width: 1400px; width: 96%; margin: 0 auto; }

        .table-card {
            background: white; border-radius: 12px; border: 1px solid #e2e8f0;
            box-shadow: var(--card-shadow); overflow: hidden;
        }

        .table-custom { margin: 0; }
        .table-custom thead { background: #f1f5f9; border-bottom: 2px solid #cbd5e1; }
        .table-custom th { padding: 15px 20px; font-size: 0.75rem; font-weight: 800; color: #475569; text-transform: uppercase; }
        .table-custom td { padding: 18px 20px; vertical-align: middle; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        .table-custom tbody tr:hover { background-color: #f8fafc; }

        .ticket-id { font-family: monospace; font-weight: 700; color: var(--navy); background: #eff6ff; padding: 4px 8px; border-radius: 6px; }
        .workflow-badge { padding: 5px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }

        .btn-assign {
            background: #e0e7ff; color: #4338ca; border: none; padding: 8px 16px; border-radius: 8px;
            font-weight: 700; font-size: 0.8rem; transition: 0.2s;
        }
        .btn-assign:hover { background: #4338ca; color: white; transform: translateY(-1px); }

        /* SweetAlert Styling */
        div:where(.swal2-container) { font-family: 'Inter', sans-serif !important; }
        .swal2-popup { border-radius: 16px !important; padding: 2em !important; }
    </style>
</head>
<body>

<header class="master-nav">
    <div class="d-flex align-items-center">
        <i class="fas fa-network-wired text-dark" style="font-size: 2.2rem;"></i>
        <div style="border-left: 2px solid #cbd5e1; padding-left: 17px; margin-left: 15px;">
            <span class="fw-bold text-dark d-block" style="font-size: 1.4rem; letter-spacing: 0.5px; line-height: 1.2;">TASK ROUTING BOARD</span>
            <small class="text-muted fw-bold" style="letter-spacing: 0.3px;" id="roleSubtext">Loading Authorization...</small>
        </div>
    </div>
    <a href="/employee/dashboard" class="btn-back">
        <i class="fas fa-arrow-left me-2"></i>Dashboard
    </a>
</header>

<div class="main-container">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
            <h4 class="fw-bold text-navy mb-1">My Assignment Inbox</h4>
            <p class="text-muted mb-0">Review requests and route them to the appropriate team members.</p>
        </div>
        <div>
            <button class="btn btn-light border fw-bold text-muted shadow-sm" onclick="fetchInbox()">
                <i class="fas fa-sync-alt me-2"></i>Refresh Queue
            </button>
        </div>
    </div>

    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-custom">
                <thead>
                <tr>
                    <th>Ticket Ref</th>
                    <th>Client / Requester</th>
                    <th>Request Details</th>
                    <th>Submitted</th>
                    <th>Current State</th>
                    <th class="text-end">Action</th>
                </tr>
                </thead>
                <tbody id="inboxTableBody">
                <tr><td colspan="6" class="text-center py-5 text-muted fw-bold"><i class="fas fa-spinner fa-spin me-2"></i>Loading Inbox...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ROUTING MODAL -->
<div class="modal fade" id="routingModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border: none; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.15);">
            <div class="modal-header" style="background-color: #1e3a8a; color: white; border-bottom: none; padding: 20px 25px;">
                <h5 class="modal-title fw-bold"><i class="fas fa-share-square me-2"></i>Route Ticket: <span id="modalTicketIdBadge"></span></h5>
                <button type="button" class="btn-close" style="filter: invert(1);" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" style="padding: 25px;">
                <form id="routingForm">
                    <input type="hidden" id="routingTicketId">

                    <div class="mb-3">
                        <label class="fw-bold text-muted small text-uppercase mb-2">Assign To (Employee ID)</label>
                        <input type="text" class="form-control bg-light" id="targetUsername" placeholder="e.g., EMP104" required>
                    </div>

                    <div class="mb-4">
                        <label class="fw-bold text-muted small text-uppercase mb-2">Target Role / Tier</label>
                        <select class="form-select bg-light" id="targetRole" required>
                            <option value="" disabled selected>Select the next tier down...</option>
                            <option value="ROLE_DELIVERY_MANAGER">Delivery Manager</option>
                            <option value="ROLE_PROJECT_MANAGER">Project Manager</option>
                            <option value="ROLE_TEAM_LEAD">Team Lead</option>
                            <option value="ROLE_EMPLOYEE">Standard Employee / Developer</option>
                        </select>
                    </div>

                    <button type="button" class="btn w-100 text-white fw-bold py-2" style="background-color: #1e3a8a; border-radius: 8px;" onclick="submitAssignment()">
                        Confirm Routing <i class="fas fa-check-circle ms-2"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        fetchInbox();
    });

    async function fetchInbox() {
        const tbody = document.getElementById('inboxTableBody');
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted fw-bold"><i class="fas fa-spinner fa-spin me-2"></i>Loading Inbox...</td></tr>';

        try {
            const response = await fetch('/api/routing/inbox');
            if (response.ok) {
                const tickets = await response.json();

                // Optional: You could fetch the current user's role here to update the header subtext
                document.getElementById('roleSubtext').textContent = "Authorized Management Portal";

                if (tickets.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="fas fa-check-double fa-3x mb-3 text-success opacity-50"></i>
                                <h5 class="fw-bold text-dark">Inbox Zero</h5>
                                <p class="mb-0">You have no pending assignments in your queue.</p>
                            </td>
                        </tr>`;
                    return;
                }

                tbody.innerHTML = '';
                tickets.forEach(req => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><span class="ticket-id">${req.ticketId}</span></td>
                        <td>
                            <div class="fw-bold text-dark">${req.employeeName}</div>
                            <div class="small text-muted">${req.employeeId}</div>
                        </td>
                        <td>
                            <div class="fw-bold text-dark mb-1">${req.category}</div>
                            <div class="text-muted small">${req.detailItem}</div>
                        </td>
                        <td class="text-muted fw-semibold">${req.submissionDate}</td>
                        <td><span class="workflow-badge"><i class="fas fa-project-diagram me-1"></i>${req.workflowState}</span></td>
                        <td class="text-end">
                            <button class="btn-assign" onclick="openRoutingModal(${req.id}, '${req.ticketId}')">
                                Route Ticket <i class="fas fa-arrow-right ms-1"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                throw new Error("Failed to fetch inbox");
            }
        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-danger fw-bold"><i class="fas fa-exclamation-triangle me-2"></i>Connection error. Could not load inbox.</td></tr>`;
        }
    }

    function openRoutingModal(databaseId, displayTicketId) {
        // Set the hidden ID and the visible Badge
        document.getElementById('routingTicketId').value = databaseId;
        document.getElementById('modalTicketIdBadge').textContent = displayTicketId;

        // Clear previous inputs
        document.getElementById('targetUsername').value = '';
        document.getElementById('targetRole').value = '';

        // Open modal
        new bootstrap.Modal(document.getElementById('routingModal')).show();
    }

    async function submitAssignment() {
        const ticketId = document.getElementById('routingTicketId').value;
        const targetUsername = document.getElementById('targetUsername').value.trim();
        const targetRole = document.getElementById('targetRole').value;

        if (!targetUsername || !targetRole) {
            Swal.fire({ icon: 'warning', title: 'Missing Info', text: 'Please provide both an Employee ID and a Target Role.', confirmButtonColor: '#1e3a8a' });
            return;
        }

        // Close modal and show loading
        bootstrap.Modal.getInstance(document.getElementById('routingModal')).hide();

        Swal.fire({
            title: 'Routing Ticket...',
            text: 'Updating chain of command...',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading(); }
        });

        try {
            const response = await fetch('/api/routing/assign', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    ticketId: ticketId,
                    targetUsername: targetUsername,
                    targetRole: targetRole
                })
            });

            if (response.ok) {
                await Swal.fire({ icon: 'success', title: 'Ticket Routed!', text: `Ticket has been successfully handed off to ${targetUsername}.`, timer: 2500, showConfirmButton: false });
                fetchInbox(); // Refresh the table behind the scenes
            } else {
                const errorMsg = await response.text();
                Swal.fire({ icon: 'error', title: 'Routing Failed', text: errorMsg, confirmButtonColor: '#1e3a8a' });
            }
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'Network Error', text: 'Could not connect to the routing engine.', confirmButtonColor: '#1e3a8a' });
        }
    }
</script>
</body>
</html>
