<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Audit Logs | WhiteCircle Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --bs-primary: #1e3a8a; --bs-primary-dark: #172554; --bg-color: #f1f5f9; }
        body { background-color: var(--bg-color); font-family: 'Plus Jakarta Sans', sans-serif; }
        .navbar-custom { background: linear-gradient(135deg, var(--bs-primary) 0%, var(--bs-primary-dark) 100%); height: 85px; }
        .content-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .table > :not(caption) > * > * { padding: 1rem 1.5rem; vertical-align: middle; border-bottom: 1px solid #e2e8f0; }
        thead th { background-color: #f8fafc; color: #64748b; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid #cbd5e1; }
        .table-hover tbody tr:hover { background-color: #f8fafc; }
        .badge-action { font-size: 0.7rem; padding: 5px 10px; border-radius: 4px; letter-spacing: 0.5px; }
    </style>

    <link href="/css/style.css" rel="stylesheet">
    <link href="/css/dark-mode.css" rel="stylesheet">
    <link href="/css/mobile-responsive.css" rel="stylesheet">
    <script src="/js/theme-engine.js"></script>

    <style>
        /* 1. Global Dark Mode Overrides */
        .dark-mode .content-card, [data-bs-theme="dark"] .content-card {
            background-color: #1e293b !important; border-color: #334155 !important;
        }
        .dark-mode .badge-action, [data-bs-theme="dark"] .badge-action {
            background-color: rgba(239, 68, 68, 0.2) !important;
        }

        /* 2. Table Core Overrides - Doubling the ID (#auditTable#auditTable) to beat mobile.css */
        .dark-mode #auditTable#auditTable, [data-bs-theme="dark"] #auditTable#auditTable,
        .dark-mode #auditTable#auditTable tr, [data-bs-theme="dark"] #auditTable#auditTable tr,
        .dark-mode #auditTable#auditTable td, [data-bs-theme="dark"] #auditTable#auditTable td,
        .dark-mode #auditTable#auditTable > :not(caption) > * > *, [data-bs-theme="dark"] #auditTable#auditTable > :not(caption) > * > * {
            background-color: #1e293b !important;
            border-color: #334155 !important;
            color: #e2e8f0 !important;
        }
        .dark-mode #auditTable#auditTable thead th, [data-bs-theme="dark"] #auditTable#auditTable thead th {
            background-color: #0f172a !important; color: #94a3b8 !important; border-color: #334155 !important;
        }

        /* 3. Mobile-Specific Dark Mode Overrides */
        @media (max-width: 991px) {
            .dark-mode #auditTable#auditTable td::before, [data-bs-theme="dark"] #auditTable#auditTable td::before {
                color: #94a3b8 !important;
            }
            .dark-mode #auditTable#auditTable td:nth-child(1), [data-bs-theme="dark"] #auditTable#auditTable td:nth-child(1),
            .dark-mode #auditTable#auditTable td:nth-child(5), [data-bs-theme="dark"] #auditTable#auditTable td:nth-child(5),
            .dark-mode #auditTable#auditTable td:nth-child(7), [data-bs-theme="dark"] #auditTable#auditTable td:nth-child(7) {
                border-color: #334155 !important;
            }
            .dark-mode #auditTable#auditTable td:nth-child(3), [data-bs-theme="dark"] #auditTable#auditTable td:nth-child(3) {
                background-color: #0f172a !important; border-color: #334155 !important;
            }
            .dark-mode #auditTable#auditTable td:nth-child(6), [data-bs-theme="dark"] #auditTable#auditTable td:nth-child(6) {
                background-color: rgba(59, 130, 246, 0.1) !important; border-color: rgba(59, 130, 246, 0.25) !important;
            }
            .dark-mode #auditTable#auditTable td:nth-child(6)::before, [data-bs-theme="dark"] #auditTable#auditTable td:nth-child(6)::before {
                color: #60a5fa !important;
            }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-custom navbar-dark mb-4">
    <div class="container-fluid px-5 d-flex justify-content-between align-items-center">
        <span class="navbar-brand fw-bold d-flex align-items-center m-0">
            <div class="bg-white bg-opacity-10 p-2 rounded me-3 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                <i class="fas fa-clipboard-list fs-5 text-white"></i>
            </div>
            <span class="fs-4">System Audit Logs</span>
        </span>
        <a href="/admin/dashboard" class="btn btn-outline-light fw-bold border-opacity-50"><i class="fas fa-arrow-left me-2"></i> Dashboard</a>
    </div>
</nav>

<div class="container-fluid px-4 px-lg-5 mb-5" style="max-width: 1400px;">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <div>
            <h3 class="fw-bold text-dark m-0">Security Audit Trail</h3>
            <p class="text-muted m-0 mt-1">Immutable record of sensitive system actions and role modifications.</p>
        </div>
    </div>

    <div class="content-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0" id="auditTable">
                <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>User / Actor</th>
                    <th>Module</th>
                    <th>Action</th>
                    <th>Previous State</th>
                    <th>New State</th>
                    <th>IP Address</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(auditLogs)}">
                    <td colspan="7" class="text-center py-5 text-muted">
                        <i class="fas fa-check-circle fa-2x mb-3 text-success opacity-50"></i>
                        <p>System secure. No sensitive actions have been logged yet.</p>
                    </td>
                </tr>
                <tr th:each="log : ${auditLogs}">
                    <td data-label="Timestamp" class="text-muted small fw-bold" th:text="${#temporals.format(log.timestamp, 'dd-MM-yyyy HH:mm:ss')}">Time</td>
                    <td data-label="User / Actor" class="fw-bold text-primary" th:text="${log.username}">User</td>
                    <td data-label="Module" class="text-secondary small fw-bold" th:text="${log.module}">Module</td>
                    <td data-label="Action">
                        <span class="badge bg-danger bg-opacity-10 text-danger border border-danger badge-action" th:text="${log.action}">ACTION</span>
                    </td>
                    <td data-label="Previous State" class="text-muted small" th:text="${log.oldValue}">Old</td>
                    <td data-label="New State" class="text-dark small fw-bold" th:text="${log.newValue}">New</td>
                    <td data-label="IP Address" class="text-muted small"><i class="fas fa-network-wired me-1 opacity-50"></i> <span th:text="${log.ipAddress}">IP</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
