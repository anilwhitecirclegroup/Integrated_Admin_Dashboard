<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Hospital | WhiteCircle Health</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --med-primary: #1E88E5;
            --med-green: #43A047;
            --med-orange: #FB8C00;
            --bg-color: #f4f7fb;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: var(--text-dark); padding-top: 100px; padding-bottom: 50px; }

        .med-nav { position: fixed; top: 0; left: 0; right: 0; height: 80px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; z-index: 1000; border-bottom: 1px solid rgba(0,0,0,0.05); }

        /* Search Section */
        .search-container { max-width: 800px; margin: 0 auto 40px; }
        .search-bar { background: white; padding: 10px; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); display: flex; }
        .search-bar input { border: none; padding: 10px 20px; outline: none; width: 100%; font-size: 1rem; }
        .filter-chips { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .chip { padding: 8px 20px; border-radius: 50px; border: 1px solid #e2e8f0; background: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .chip.active { background: var(--med-primary); color: white; border-color: var(--med-primary); }

        /* Hospital Cards */
        .hospital-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.03); transition: 0.3s; height: 100%; border: 1px solid #f1f5f9; }
        .hospital-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
        .map-thumb { height: 150px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; color: #94a3b8; }
        .card-body { padding: 20px; }

        .badge-247 { background: var(--med-green); color: white; font-size: 0.7rem; padding: 4px 8px; border-radius: 6px; font-weight: 700; }

        /* Call Button Animation */
        .btn-call { background: var(--med-primary); color: white; border-radius: 12px; width: 100%; padding: 12px; font-weight: 700; transition: 0.3s; position: relative; }
        .btn-call:hover { background: var(--med-primary-dark); transform: scale(1.02); }
        .btn-call i { animation: ring 2s infinite; }
        @keyframes ring { 0% { transform: rotate(0); } 10% { transform: rotate(15deg); } 20% { transform: rotate(-15deg); } 30% { transform: rotate(15deg); } 40% { transform: rotate(0); } }
    </style>
</head>
<body>

<nav class="med-nav">
    <div class="fw-bold fs-4 text-primary"><i class="fas fa-shield-heart me-2"></i> WhiteCircle Health</div>
    <a href="/employee/mediclaim/portal" class="btn btn-outline-secondary btn-sm rounded-pill px-3 fw-bold">
        <i class="fas fa-arrow-left me-1"></i>Back to Dashboard</a>
</nav>

<div class="container">
    <div class="search-container text-center">
        <h3 class="fw-bold mb-4">Find a Network Hospital</h3>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by hospital name or location...">
            <button class="btn btn-primary rounded-pill px-4">Search</button>
        </div>
        <div class="filter-chips">
            <div class="chip active" onclick="filter('all')">All Hospitals</div>
            <div class="chip" onclick="filter('cashless')">Cashless</div>
            <div class="chip" onclick="filter('emergency')">Emergency 24x7</div>
        </div>
    </div>

    <div class="row g-4" id="hospitalGrid">
        <div class="col-md-4 hospital-card-wrapper" data-type="cashless emergency">
            <div class="hospital-card">
                <div class="map-thumb"><i class="fas fa-map-marked-alt fa-3x"></i></div>
                <div class="card-body">
                    <span class="badge-247">24x7 AVAILABLE</span>
                    <h5 class="fw-bold mt-2">Apollo Hospitals</h5>
                    <p class="text-muted small mb-2"><i class="fas fa-map-marker-alt me-1"></i> Saket, New Delhi</p>
                    <button class="btn btn-call"><i class="fas fa-phone-alt me-2"></i> Call Hospital</button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    function filter(type) {
        // Toggle active class for chips
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        event.target.classList.add('active');

        // Filter logic
        document.querySelectorAll('.hospital-card-wrapper').forEach(card => {
            if (type === 'all' || card.getAttribute('data-type').includes(type)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }
</script>
</body>
</html>
